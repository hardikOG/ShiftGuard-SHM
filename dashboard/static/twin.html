<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShiftGuard Digital Twin</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f4f5f7; --card: #fff; --ink: #16191d; --muted: #6b7380; --line: #e2e5e9;
          --ok: #18a058; --env: #2a78d6; --fault: #eb6834; --dmg: #d03b3b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .top h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .top small { color: var(--muted); }
  #verdict { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 14px; padding: 16px 20px;
             border-left: 10px solid var(--ok); margin-bottom: 12px; }
  #verdict .icon { font-size: 34px; }
  #verdict b { font-size: 22px; display: block; }
  #verdict span { color: var(--muted); }
  .card { background: var(--card); border-radius: 14px; overflow: hidden; }
  #scene { width: 100%; display: block; background: #fbfcfd; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; padding: 6px 0 2px; }
  .actions { display: flex; gap: 10px; padding: 12px 16px 16px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 16px; cursor: pointer; color: var(--ink); }
  button:hover { background: #f1f3f5; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  .stat { background: var(--card); border-radius: 14px; padding: 12px 16px; }
  .stat span { display: block; color: var(--muted); font-size: 13px; }
  .stat b { font-size: 22px; }
  #lastAlert { background: var(--card); border-radius: 14px; padding: 12px 16px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  details { margin-top: 12px; background: var(--card); border-radius: 14px; padding: 10px 16px; }
  summary { cursor: pointer; color: var(--muted); }
  .more { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 10px 0 4px; font-size: 14px; }
  #scope { width: 100%; height: 110px; display: block; border-radius: 8px; margin-top: 8px; }
  #menu { position: fixed; display: none; background: #fff; border: 1px solid var(--line); border-radius: 12px;
          box-shadow: 0 10px 30px rgba(0,0,0,.15); padding: 6px; z-index: 10; min-width: 200px; }
  #menu div { font-weight: 650; padding: 6px 10px; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; padding: 8px 10px; }
  #offline { display: none; text-align: center; padding: 30px; color: var(--muted); }
  @media (max-width: 700px) { .stats { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🌉 ShiftGuard — live bridge</h1>
    <small id="conn">connecting…</small>
  </div>

  <div id="verdict"><span class="icon">⏳</span><div><b>Waiting for data…</b><span class="txt">Start it with <code>python run_demo.py</code></span></div></div>

  <div class="card">
    <svg id="scene" viewBox="0 0 1000 330" aria-label="Bridge"></svg>
    <div id="offline"></div>
    <div class="hint">Click a sensor to break it</div>
    <div class="actions">
      <button data-cmd='{"cmd":"coldsnap","delta":-12,"hours":96}'>❄️ Cold snap</button>
      <button id="dmgBtn">💥 Damage the bridge</button>
      <button data-cmd='{"cmd":"clear"}'>🔧 Repair everything</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>Health</span><b id="health">–</b></div>
    <div class="stat"><span>Temperature</span><b id="temp">–</b></div>
    <div class="stat"><span>Hours monitored</span><b id="hours">–</b></div>
    <div class="stat"><span title="Alarm hours on a healthy bridge, counted from 24 h after the last injected event">False alarms: ShiftGuard vs old method</span><b id="fa">0 vs 0</b></div>
  </div>

  <div id="lastAlert">No alerts yet.</div>

  <details>
    <summary>More controls</summary>
    <div class="more">
      <button id="lossBtn">📶 Packet loss: off</button>
      <button id="pauseBtn">⏸ Pause</button>
      <label>Speed <select id="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option></select></label>
      <label><input type="checkbox" id="dhtOn"> Set temperature <input type="range" id="dhtT" min="-25" max="40" step="1" value="8"> <b id="dhtV">8 °C</b></label>
    </div>
    <canvas id="scope"></canvas>
    <small style="color:var(--muted)">Raw signal of the last sensor you clicked (now: <span id="scopeName">S3</span>)</small>
  </details>
</div>

<div id="menu"></div>

<script src="mqtt.min.js"></script>
<script>
"use strict";
const qs = new URLSearchParams(location.search);
const WS_PORT = qs.get("ws") || "9001", BRIDGE = qs.get("bridge") || "bridge01", HOST = qs.get("host") || location.hostname || "localhost";
const N = 8, FS = 100, T = (...p) => ["shm", BRIDGE, ...p].join("/");
const VERDICT = {
  NORMAL: ["✅", "Bridge is healthy", "#18a058"],
  ENVIRONMENT: ["🌡️", "Unusual weather — not damage", "#2a78d6"],
  SENSOR_FAULT: ["🔧", "A sensor is broken — not damage", "#eb6834"],
  STRUCTURAL_DAMAGE: ["🚨", "Structural damage detected", "#d03b3b"],
};
const S = { wave: Array.from({ length: N }, () => new Float32Array(2048)), lp1: new Float32Array(N), lp2: new Float32Array(N),
            playhead: 0, scale: 1e-9, fa: 0, bfa: 0, lastEvent: -1e9, status: null, sim: null, temp: null, scopeSensor: 2, connected: false };

// ------------------------------------------------------------- scene
const svg = document.getElementById("scene"), NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}, p = svg) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const X0 = 110, X1 = 890, DY = 150, nodeX = i => X0 + (i + 1) * (X1 - X0) / (N + 1);
el("rect", { x: 0, y: 255, width: 1000, height: 75, fill: "#cfe3f3" });
el("path", { d: `M0 165 L${X0 + 4} 165 L${X0 + 30} 330 L0 330Z`, fill: "#d8cbb2" });
el("path", { d: `M1000 165 L${X1 - 4} 165 L${X1 - 30} 330 L1000 330Z`, fill: "#d8cbb2" });
const snow = el("g", { opacity: 0 });
const flakes = Array.from({ length: 35 }, () => ({ x: Math.random() * 1000, y: Math.random() * 255, v: .4 + Math.random() * .7, c: el("circle", { r: 2, fill: "#fff", stroke: "#c5d3e0", "stroke-width": .6 }, snow) }));
const deck = el("path", { stroke: "#5f6873", "stroke-width": 14, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round" });
const crack = el("path", { stroke: "#d03b3b", "stroke-width": 4, fill: "none", opacity: 0 });
const thermo = el("text", { x: X0 + 10, y: 60, "font-size": 22, "font-weight": 650, fill: "#16191d" });
const edge = el("g", { transform: "translate(20, 200)" });
el("rect", { width: 70, height: 34, rx: 8, fill: "#1f2933" }, edge);
el("text", { x: 35, y: 22, "text-anchor": "middle", fill: "#fff", "font-size": 13, "font-weight": 600 }, edge).textContent = "EDGE";

const nodes = [];
for (let i = 0; i < N; i++) {
  const g = el("g", { style: "cursor:pointer" });
  el("rect", { x: -30, y: -20, width: 60, height: 70, fill: "#000", "fill-opacity": 0 }, g);
  const body = el("rect", { x: -18, y: 0, width: 36, height: 30, rx: 7, fill: "#2b3642" }, g);
  const led = el("circle", { cx: 0, cy: 11, r: 6, fill: "#18a058" }, g);
  el("text", { x: 0, y: 46, "text-anchor": "middle", "font-size": 13, fill: "#6b7380" }, g).textContent = `S${i + 1}`;
  g.addEventListener("click", ev => openMenu(i, ev));
  nodes.push({ g, led, body });
}

function curve(p) {
  let d = `M ${p[0][0]} ${p[0][1]}`;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[Math.max(0, i - 1)], b = p[i], c = p[i + 1], e = p[Math.min(p.length - 1, i + 2)];
    d += ` C ${b[0] + (c[0] - a[0]) / 6} ${b[1] + (c[1] - a[1]) / 6}, ${c[0] - (e[0] - b[0]) / 6} ${c[1] - (e[1] - b[1]) / 6}, ${c[0]} ${c[1]}`;
  }
  return d;
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const steps = S.sim && S.sim.paused ? 0 : Math.max(1, Math.round(dt * FS));
  for (let s = 0; s < steps; s++) {                      // replay the latest window in real time, low-passed
    S.playhead = (S.playhead + 1) % 2048;
    for (let i = 0; i < N; i++) { S.lp1[i] += .22 * (S.wave[i][S.playhead] - S.lp1[i]); S.lp2[i] += .22 * (S.lp1[i] - S.lp2[i]); }
  }
  let rms = 0; for (let i = 0; i < N; i++) rms += S.lp2[i] ** 2;
  S.scale = Math.max(S.scale * .995, Math.sqrt(rms / N), 1e-9);
  const y = Array.from(S.lp2, v => Math.max(-28, Math.min(28, v / S.scale * 13)));
  const pts = [[X0, DY], ...y.map((v, i) => [nodeX(i), DY + v]), [X1, DY]];
  deck.setAttribute("d", curve(pts));
  const cold = S.temp !== null && S.temp < 0;
  snow.setAttribute("opacity", cold ? 1 : 0);
  if (cold) for (const f of flakes) { f.y += f.v; if (f.y > 255) { f.y = 0; f.x = Math.random() * 1000; } f.c.setAttribute("cx", f.x); f.c.setAttribute("cy", f.y); }
  const dmg = S.sim ? S.sim.damage : 0;
  if (dmg) { const xc = (nodeX(4) + nodeX(5)) / 2, yc = (pts[5][1] + pts[6][1]) / 2, h = dmg === 2 ? 14 : 8;
             crack.setAttribute("d", `M ${xc - 3} ${yc - h} L ${xc + 3} ${yc - 2} L ${xc - 3} ${yc + 2} L ${xc + 3} ${yc + h}`); crack.setAttribute("opacity", 1); }
  else crack.setAttribute("opacity", 0);
  const st = S.status;
  for (let i = 0; i < N; i++) {
    let c = "#18a058";
    if (st && st.label === "SENSOR_FAULT" && st.fault_sensor === i + 1) c = "#eb6834";
    if (st && st.label === "STRUCTURAL_DAMAGE" && (st.damage_location || []).includes(i + 1)) c = "#d03b3b";
    if (st && (st.imputed || []).includes(i + 1)) c = "#a8b0b9";
    nodes[i].led.setAttribute("fill", c);
    nodes[i].g.setAttribute("transform", `translate(${nodeX(i)}, ${DY + 20 + y[i]})`);
  }
  drawScope();
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------- small scope (under "More controls")
const scope = document.getElementById("scope"), sc = scope.getContext("2d");
function drawScope() {
  if (!scope.offsetParent) return;                       // hidden while "More controls" is closed
  const w = scope.clientWidth, h = scope.clientHeight, r = devicePixelRatio || 1;
  if (scope.width !== Math.round(w * r)) { scope.width = Math.round(w * r); scope.height = Math.round(h * r); }
  sc.setTransform(r, 0, 0, r, 0, 0); sc.fillStyle = "#11181f"; sc.fillRect(0, 0, w, h);
  const d = S.wave[S.scopeSensor]; let pk = 1e-12; for (let k = 0; k < 2048; k += 4) pk = Math.max(pk, Math.abs(d[k]));
  sc.strokeStyle = "#5ee08a"; sc.beginPath();
  for (let x = 0; x < w; x++) { const v = d[Math.floor(x / w * 2048)] / pk, yy = h / 2 - v * (h / 2 - 4); x ? sc.lineTo(x, yy) : sc.moveTo(x, yy); }
  sc.stroke();
}

// ------------------------------------------------------------- status
function render(st) {
  const [icon, text, col] = VERDICT[st.label] || ["", st.label, "#6b7380"];
  let detail = "No action needed.";
  if (st.label === "SENSOR_FAULT") detail = `Sensor S${st.fault_sensor} disagrees with the rest — replace it. The bridge itself is fine.`;
  if (st.label === "STRUCTURAL_DAMAGE") detail = `Near sensors S${(st.damage_location || []).join(" and S")}` + (st.severity ? ` · severity: ${st.severity}` : "") + " — send an inspector.";
  if (st.label === "ENVIRONMENT") detail = "Colder or hotter than anything seen before. Watching, no damage alarm.";
  const v = document.getElementById("verdict");
  v.style.borderLeftColor = col;
  v.innerHTML = `<span class="icon"></span><div><b></b><span class="txt"></span></div>`;
  v.querySelector(".icon").textContent = icon; v.querySelector("b").textContent = text; v.querySelector(".txt").textContent = detail;
  document.getElementById("health").textContent = `${Math.round(st.health_score)} / 100`;
  document.getElementById("temp").textContent = `${st.temp.toFixed(1)} °C`;
  thermo.textContent = `🌡 ${st.temp.toFixed(1)} °C`;
  document.getElementById("hours").textContent = Math.round(st.t_hours);
  // count only settled healthy hours: right after a repair the evidence needs a few hours to decay
  if (st.truth && st.truth !== "healthy") S.lastEvent = st.t_hours;
  if (st.truth === "healthy" && st.t_hours - S.lastEvent > 24) { if (st.label !== "NORMAL") S.fa++; if (st.baseline_alarm) S.bfa++; }
  document.getElementById("fa").textContent = `${S.fa} vs ${S.bfa}`;
}

// ------------------------------------------------------------- MQTT
const conn = document.getElementById("conn"), offline = document.getElementById("offline");
function setConn(ok) {
  S.connected = ok;
  conn.textContent = ok ? "● live" : "● offline";
  conn.style.color = ok ? "#18a058" : "#d03b3b";
  offline.style.display = ok ? "none" : "block";
  offline.textContent = ok ? "" : `Can't reach the broker at ws://${HOST}:${WS_PORT}. Is "python run_demo.py" running?`;
}
let client = null;
if (typeof mqtt === "undefined") setConn(false);
else {
  client = mqtt.connect(`ws://${HOST}:${WS_PORT}`, { protocolVersion: 4, reconnectPeriod: 2000, connectTimeout: 5000,
                                                       clientId: "shm-twin-" + Math.random().toString(16).slice(2, 10) });
  client.on("connect", () => { setConn(true); client.subscribe([T("node", "+", "accel"), T("env", "temperature"), T("status"), T("alert"), T("sim", "state")]); });
  client.on("close", () => setConn(false));
  client.on("message", (topic, payload) => {
    let d; try { d = JSON.parse(payload.toString()); } catch { return; }
    if (topic.endsWith("/accel")) {
      const i = (d.sensor | 0) - 1; if (i < 0 || i >= N || !Array.isArray(d.data)) return;
      const w = S.wave[i]; for (let k = 0; k < Math.min(2048, d.data.length); k++) w[k] = d.data[k];
    } else if (topic.endsWith("/env/temperature")) { S.temp = d.temp; }
    else if (topic.endsWith("/status")) { S.status = d; render(d); }
    else if (topic.endsWith("/alert")) { document.getElementById("lastAlert").textContent = `Latest alert (bridge hour ${Math.round(d.t_hours)}): ${d.message}`; }
    else if (topic.endsWith("/sim/state")) {
      S.sim = d;
      document.getElementById("pauseBtn").textContent = d.paused ? "▶ Resume" : "⏸ Pause";
      document.getElementById("lossBtn").textContent = d.packet_loss ? "📶 Packet loss: on" : "📶 Packet loss: off";
      document.getElementById("dmgBtn").textContent = d.damage === 0 ? "💥 Damage the bridge" : d.damage === 1 ? "💥 Make it severe" : "💥 Severe damage";
    }
  });
}
const send = cmd => { if (client && S.connected) client.publish(T("control"), JSON.stringify(cmd), { qos: 1 }); };

// ------------------------------------------------------------- controls
document.querySelectorAll("button[data-cmd]").forEach(b => b.onclick = () => send(JSON.parse(b.dataset.cmd)));
document.getElementById("dmgBtn").onclick = () => send({ cmd: "damage", level: Math.min(2, (S.sim ? S.sim.damage : 0) + 1) });
document.getElementById("lossBtn").onclick = () => send({ cmd: "packet_loss", p: S.sim && S.sim.packet_loss ? 0 : 0.05 });
document.getElementById("pauseBtn").onclick = () => send({ cmd: S.sim && S.sim.paused ? "resume" : "pause" });
document.getElementById("speed").onchange = e => send({ cmd: "speed", rate: +e.target.value });
const dhtT = document.getElementById("dhtT"), dhtOn = document.getElementById("dhtOn");
dhtT.oninput = () => { document.getElementById("dhtV").textContent = `${dhtT.value} °C`; };
setInterval(() => { if (dhtOn.checked && client && S.connected) client.publish(T("env", "override"), JSON.stringify({ temp: +dhtT.value, source: "twin" })); }, 1000);

const menu = document.getElementById("menu");
const FAULTS = [["noise", "Make it noisy"], ["drift", "Make it drift slowly"], ["dropout", "Switch it off"], ["spikes", "Add glitches"]];
function openMenu(i, ev) {
  ev.stopPropagation();
  S.scopeSensor = i; document.getElementById("scopeName").textContent = `S${i + 1}`;
  menu.innerHTML = `<div>Sensor S${i + 1}</div>`;
  for (const [kind, name] of FAULTS) {
    const b = document.createElement("button"); b.textContent = name;
    b.onclick = () => { send({ cmd: "fault", kind, sensor: i + 1, hours: 48 }); menu.style.display = "none"; };
    menu.appendChild(b);
  }
  const r = document.createElement("button"); r.textContent = "Repair it";
  r.onclick = () => { send({ cmd: "repair_sensor", sensor: i + 1 }); menu.style.display = "none"; };
  menu.appendChild(r);
  menu.style.display = "block";
  menu.style.left = `${Math.min(ev.clientX, innerWidth - 220)}px`;
  menu.style.top = `${Math.min(ev.clientY, innerHeight - 240)}px`;
}
document.addEventListener("click", e => { if (!menu.contains(e.target)) menu.style.display = "none"; });
requestAnimationFrame(frame);
</script>
</body>
</html>
